name: Scheduled Commit Bot

on:
  schedule:
    - cron: "0 9 * * *"   # daily at 09:00 UTC — placeholder, replaced in Phase 2
  workflow_dispatch: {}     # enables the manual "Run workflow" button

permissions:
  contents: write            # required for the built-in GITHUB_TOKEN if ever used as fallback

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}   # use PAT so subsequent git push is authenticated
          fetch-depth: 0                  # full history, needed later for conflict detection (Phase 4)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run bot script
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/push.py